<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Birkhanym Kazhymukhamet — Software engineer & AI builder</title>
    <meta
      name="description"
      content="Portfolio of Birkhanym Kazhymukhamet: AI products, full-stack platforms, and research from Astana, Kazakhstan."
    />
    <meta property="og:title" content="Birkhanym Kazhymukhamet" />
    <meta property="og:description" content="Software engineer & AI builder from Astana, Kazakhstan." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <!--
      Set the theme before the first paint, or the page renders light for a
      frame and then flips. theme.js is the source of truth once loaded.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("bk_theme");
          var dark =
            saved === "dark" ||
            (saved !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          if (dark) {
            document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0e0e13");
          }
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
