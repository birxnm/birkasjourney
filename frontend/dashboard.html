<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Birka's Journey — Dashboard</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="container">

    <header class="topbar">
      <div>
        <h1>Birka's Journey</h1>
        <p class="sub" id="greeting">Loading…</p>
      </div>
      <div class="habit-actions">
        <button class="btn btn-sm" id="link-telegram" type="button">🔗 Link Telegram</button>
        <button class="btn btn-sm" id="logout" type="button">Log out</button>
      </div>
    </header>

    <!-- Stats -->
    <section class="grid grid-stats" style="margin-bottom:1rem">
      <div class="card stat">
        <div class="label">Current streak</div>
        <div class="value" id="stat-streak">—</div>
      </div>
      <div class="card stat">
        <div class="label">7-day completion</div>
        <div class="value" id="stat-rate">—</div>
      </div>
      <div class="card stat">
        <div class="label">Today done</div>
        <div class="value" id="stat-today">—</div>
      </div>
      <div class="card stat">
        <div class="label">Total entries</div>
        <div class="value" id="stat-total">—</div>
      </div>
    </section>

    <div class="grid grid-main">
      <!-- Left column -->
      <div>
        <section class="card">
          <div class="card-title">
            <h2>Today's habits</h2>
            <span class="muted" id="today-date"></span>
          </div>
          <div id="habits-list"><p class="empty">Loading habits…</p></div>
        </section>

        <section class="card">
          <div class="card-title">
            <h2>Log an entry</h2>
          </div>
          <form id="log-form">
            <div class="row">
              <div class="field">
                <label for="log-habit">Habit</label>
                <select id="log-habit" required></select>
              </div>
              <div class="field">
                <label for="log-value" id="log-value-label">Value</label>
                <input type="text" id="log-value" placeholder="2" required />
              </div>
              <button class="btn btn-primary" type="submit">Save</button>
            </div>
            <p class="muted" id="log-hint" style="margin-top:0.5rem"></p>
          </form>
        </section>

        <section class="card">
          <div class="card-title">
            <h2>Weekly progress</h2>
            <select id="chart-habit" style="width:auto"></select>
          </div>
          <div class="chart-box"><canvas id="chart-line"></canvas></div>
        </section>

        <section class="card">
          <div class="card-title"><h2>Completion by habit — last 7 days</h2></div>
          <div class="chart-box"><canvas id="chart-bar"></canvas></div>
        </section>
      </div>

      <!-- Right column -->
      <aside>
        <section class="card">
          <div class="card-title"><h2>💫 Daily motivation</h2></div>
          <div id="quotes-list"><p class="empty">Loading quotes…</p></div>
        </section>

        <section class="card">
          <div class="card-title"><h2>⏰ Reminders</h2></div>
          <form id="reminder-form" style="margin-bottom:0.75rem">
            <div class="field">
              <label for="reminder-time">Time</label>
              <input type="time" id="reminder-time" required />
            </div>
            <div class="field">
              <label for="reminder-message">Message</label>
              <input type="text" id="reminder-message" maxlength="500"
                     placeholder="Drink your last glass of water" required />
            </div>
            <button class="btn btn-block" type="submit">Add reminder</button>
          </form>
          <p class="muted" style="margin-bottom:0.5rem">
            Reminders arrive in Telegram — link your account first.
          </p>
          <div id="reminders-list"></div>
        </section>
      </aside>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/habits.js"></script>
  <script src="/js/charts.js"></script>
  <script src="/js/quotes.js"></script>
  <script src="/js/reminders.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
