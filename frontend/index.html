<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Birka's Journey — Sign in</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main class="auth-wrap">
    <div class="auth-card">
      <div class="auth-brand">
        <h1>Birka's Journey</h1>
        <p>Six habits. One day at a time.</p>
      </div>

      <div class="card">
        <div class="tabs">
          <button class="tab active" data-tab="login" type="button">Log in</button>
          <button class="tab" data-tab="register" type="button">Create account</button>
        </div>

        <div class="alert alert-error" id="alert" hidden></div>

        <!-- Log in -->
        <form id="login-form">
          <div class="field">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" autocomplete="email"
                   placeholder="you@example.com" required />
          </div>
          <div class="field">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" autocomplete="current-password"
                   placeholder="••••••••" required />
          </div>
          <button class="btn btn-primary btn-block" type="submit">Log in</button>
        </form>

        <!-- Register -->
        <form id="register-form" hidden>
          <div class="field">
            <label for="register-username">Name <span class="muted">(optional)</span></label>
            <input type="text" id="register-username" autocomplete="nickname"
                   placeholder="Birka" maxlength="100" />
          </div>
          <div class="field">
            <label for="register-email">Email</label>
            <input type="email" id="register-email" autocomplete="email"
                   placeholder="you@example.com" required />
          </div>
          <div class="field">
            <label for="register-password">Password <span class="muted">(min 6 characters)</span></label>
            <input type="password" id="register-password" autocomplete="new-password"
                   placeholder="••••••••" minlength="6" required />
          </div>
          <button class="btn btn-primary btn-block" type="submit">Create account</button>
        </form>
      </div>

      <p class="muted" style="text-align:center; margin-top:1rem">
        Prefer Telegram? Send <strong>/start</strong> to the bot — then link the two
        accounts from your dashboard.
      </p>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
